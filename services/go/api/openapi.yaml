openapi: 3.0.3
info:
  title: EOP API Gateway
  version: 1.0.0
  description: |
    Public REST API of the Exodus Ops Platform (ADR-010). It exposes the state of the node
    registry kept by eop-server without requiring clients to speak the internal socket protocol.

    Versioning: every route lives under `/v1/`. Removing or renaming a field, changing a type or
    changing a status code is a breaking change and requires `/v2/`, served alongside `/v1/`
    until consumers migrate. Adding optional fields or new routes is not breaking.

    Every response carries `X-EOP-Version` and `X-EOP-Track` (for example `0.3.1` and
    `canary`), naming the gateway deployment that served it during a canary or blue-green
    rollout (ADR-011). They are informational: clients must not depend on their values.
servers:
  - url: /
tags:
  - name: nodes
    description: Node registry.
  - name: graph
    description: Network topology analysis on the HPC engine (US-302).
  - name: external
    description: |
      Data from Vault-Tec's external services, protected by a circuit breaker per service
      (US-303, ADR-012). When a service fails or its circuit is open, the gateway answers with
      the last good data marked `meta.stale: true`, or with `503 SERVICE_DEGRADED` and
      `Retry-After` when it has none. It never answers `500` because of an external service.
  - name: operations
    description: Health and API description.
paths:
  /v1/nodes:
    get:
      tags: [nodes]
      operationId: listNodes
      summary: List every registered node.
      responses:
        "200":
          description: All nodes, possibly an empty list.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Node"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/nodes/{node_id}:
    get:
      tags: [nodes]
      operationId: getNode
      summary: Get one node.
      parameters:
        - name: node_id
          in: path
          required: true
          description: 1 to 63 characters from A-Z, a-z, 0-9, dot, underscore and hyphen.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,63}$"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Node"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/nodes/{node_id}/insights:
    get:
      tags: [external]
      operationId: getNodeInsights
      summary: Risk assessment of a node from the AI service.
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "200":
          description: |
            Fresh data, or — fallback while the AI service is unavailable — the last good data
            for this node with `meta.stale: true` and `meta.stale_since`.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Insights"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/Degraded"
  /v1/nodes/{node_id}/corporate:
    get:
      tags: [external]
      operationId: getNodeCorporateStatus
      summary: Supply and compliance status of the node's bunker from the corporate service.
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "200":
          description: |
            Fresh data, or — fallback while the corporate service is unavailable — the last good
            data for this bunker with `meta.stale: true` and `meta.stale_since`.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/CorporateStatus"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/Degraded"
  /v1/graph/analyze:
    post:
      tags: [graph]
      operationId: analyzeGraph
      summary: Analyze a network topology.
      description: |
        Graphs with fewer than 1,000 nodes (configurable) are analyzed synchronously and answered
        with `200` within 5 seconds. Larger graphs become a job: the answer is `202 Accepted`
        with a `job_id`, and `GET /v1/graph/jobs/{job_id}` returns the result when it finishes.
        Results stay available for at least 5 minutes after completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Synchronous result.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: object
                    required: [result]
                    additionalProperties: false
                    properties:
                      result:
                        $ref: "#/components/schemas/AnalysisResult"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "202":
          description: Accepted as an asynchronous job.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/AcceptedJob"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The body or the graph exceeds the configured size limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many jobs are queued in this gateway; retry after `Retry-After` seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          description: The synchronous analysis did not finish within its time limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/graph/jobs:
    get:
      tags: [graph]
      operationId: listJobs
      summary: Recent analysis jobs, newest first, without results.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/graph/jobs/{job_id}:
    get:
      tags: [graph]
      operationId: getJob
      summary: State of a job and, once it succeeded, its result.
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Job"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/health:
    get:
      tags: [operations]
      operationId: getHealth
      summary: Readiness of the gateway.
      description: |
        200 when the gateway can reach eop-server. Used as the Kubernetes readiness probe; a
        503 takes the pod out of the Service without restarting it.
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/Health"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/openapi.json:
    get:
      tags: [operations]
      operationId: getOpenAPI
      summary: This document, as JSON.
      responses:
        "200":
          description: OpenAPI 3.0 document.
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    NodeID:
      name: node_id
      in: path
      required: true
      description: 1 to 63 characters from A-Z, a-z, 0-9, dot, underscore and hyphen.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,63}$"
  schemas:
    Insights:
      type: object
      required: [node_id, risk_score, recommendation]
      properties:
        node_id:
          type: string
        risk_score:
          type: number
          minimum: 0
          maximum: 1
        recommendation:
          type: string
    CorporateStatus:
      type: object
      required: [bunker_name, supply_quota, compliant]
      properties:
        bunker_name:
          type: string
        supply_quota:
          type: integer
        compliant:
          type: boolean
    Node:
      type: object
      required: [node_id, bunker_name, status, ip_address, capacity, last_seen_at]
      additionalProperties: false
      properties:
        node_id:
          type: string
          example: alpha-01
        bunker_name:
          type: string
          example: Zone-B
        status:
          type: string
          enum: [ONLINE, OFFLINE]
        ip_address:
          type: string
          example: 10.0.0.6
        capacity:
          type: integer
          example: 10
        last_seen_at:
          type: string
          format: date-time
    Health:
      type: object
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            `degraded` when a non-critical dependency (Redis, used by analysis jobs) is down:
            node routes and synchronous analysis keep working.
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    AnalyzeRequest:
      type: object
      required: [nodes, edges, algorithms]
      additionalProperties: false
      properties:
        nodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
          example: [A, B, C]
        edges:
          type: array
          items:
            type: object
            required: [from, to, weight]
            additionalProperties: false
            properties:
              from:
                type: string
              to:
                type: string
              weight:
                type: number
                exclusiveMinimum: true
                minimum: 0
          example: [{from: A, to: B, weight: 10}, {from: B, to: C, weight: 5}]
        algorithms:
          type: array
          minItems: 1
          items:
            type: string
            enum: [shortest_paths, connected_components, centrality]
    AnalysisResult:
      type: object
      description: |
        Result of the HPC engine, as defined by the ANALYZE_GRAPH contract
        (docs/analyze-graph-protocol-v0.2.md): graph_size, processing_time_ms, thread_count,
        executed_algorithms, algorithm_timings_ms, algorithms and, when centrality is
        approximate, algorithm_metadata.
      additionalProperties: true
    AcceptedJob:
      type: object
      required: [job_id, status, status_url]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
        status_url:
          type: string
          example: /v1/graph/jobs/5f0c6f4e-0d1a-4a8e-9a56-3c7b1d2e4f60
    Job:
      type: object
      required: [job_id, status, created_at, graph_size, algorithms]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        graph_size:
          type: object
          required: [nodes, edges]
          additionalProperties: false
          properties:
            nodes:
              type: integer
            edges:
              type: integer
        algorithms:
          type: array
          items:
            type: string
        result:
          $ref: "#/components/schemas/AnalysisResult"
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
    Meta:
      type: object
      required: [timestamp]
      additionalProperties: false
      properties:
        timestamp:
          type: string
          format: date-time
        trace_id:
          type: string
          description: OpenTelemetry trace id of the request, for log and trace lookup.
          pattern: "^[0-9a-f]{32}$"
        stale:
          type: boolean
          description: true when `data` was served from the cache because an external service is unavailable.
        stale_since:
          type: string
          format: date-time
          description: When the cached data was obtained.
    Error:
      type: object
      required: [error, meta]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
            message:
              type: string
            field:
              type: string
              description: Name of the offending input, on validation errors.
        meta:
          $ref: "#/components/schemas/Meta"
  responses:
    BadRequest:
      description: Invalid input. `error.field` names the offending input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamError:
      description: eop-server answered something the gateway could not use.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected failure inside the gateway. The body never carries internal details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Degraded:
      description: |
        Fallback while an external service is unavailable (circuit open, timeout or 5xx) and no
        cached data exists for this item. Retry after `Retry-After` seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: |
        eop-server, the HPC engine or the job store could not be reached or did not answer in
        time. Internal details are never included.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
