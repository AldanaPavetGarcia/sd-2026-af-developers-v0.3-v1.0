# Grafana Loki, single binary (US-306, ADR-026). Source of truth for the loki-config ConfigMap,
# generated by `make k8s-apply` like the dashboards.
#
# Retention (US-306 AC4, AC8): 7 days, enforced by the compactor; the index and chunks live on the
# loki-data PersistentVolumeClaim, so restarting Loki loses nothing.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # OTLP log attributes (level, trace_id, span_id, node_id, event) are kept as structured
  # metadata: filterable in LogQL without becoming index labels.
  allow_structured_metadata: true
  # Agents retry; a slightly higher burst avoids dropping a pod's backlog after a restart.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
