# OpenTelemetry Collector running as a node agent (DaemonSet) that ships every pod's logs to
# Loki (US-306, ADR-026). Source of truth for the otel-log-agent-config ConfigMap, generated by
# `make k8s-apply`.
#
# Pipeline: container log file → CRI parser → JSON fields of EOP logs (ADR-019) as attributes →
# trace_id/span_id as the record's real trace context → level as severity → message as the body
# → pod metadata → Loki's native OTLP endpoint.
extensions:
  # Read offsets survive an agent restart: no lost and no duplicated lines (US-306 AC4).
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  filelog:
    include: [/var/log/pods/*/*/*.log]
    # The agent's own logs would feed back into itself.
    exclude: [/var/log/pods/*/otel-log-agent/*.log]
    # With offsets checkpointed, "beginning" only applies to files the agent has never seen, so
    # lines written before a new pod's agent started (or while it restarted) are still collected.
    start_at: beginning
    include_file_path: true
    storage: file_storage
    retry_on_failure:
      enabled: true
    operators:
      - type: container
        id: container-parser
      - type: json_parser
        id: eop-json
        if: 'body matches "^\\s*\\{"'
        parse_to: attributes
        on_error: send_quiet
      - type: trace_parser
        if: 'attributes.trace_id != nil and attributes.trace_id != ""'
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
        on_error: send_quiet
      - type: severity_parser
        if: 'attributes.level != nil'
        parse_from: attributes.level
        preserve_to: attributes.level
        mapping:
          debug: DEBUG
          info: [INFO, CONTROL, EVENT, CONNECTION, LOG]
          warn: [WARN, WARNING]
          error: ERROR
          fatal: CRITICAL
        on_error: send_quiet
      - type: move
        if: 'attributes.message != nil'
        from: attributes.message
        to: body
      - type: move
        if: 'attributes.service != nil'
        from: attributes.service
        to: resource["service.name"]

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
    extract:
      metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
      labels:
        - tag_name: app
          key: app
          from: pod
  # Third-party containers do not log a "service" field: name them after their app label.
  transform/service_name:
    log_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], attributes["app"]) where attributes["service.name"] == nil and attributes["app"] != nil
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      storage: file_storage

service:
  extensions: [file_storage, health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, k8sattributes, transform/service_name, batch]
      exporters: [otlphttp/loki]
