name: CI Pipeline

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# A new push cancels the run still going for the same PR: with stacked PRs every rebase pushes
# them all, and only the last run matters (the free plan has 2,000 Actions minutes a month).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "90"

jobs:
  validate-branch-name:
    name: validate-branch-name
    runs-on: ${{ vars.EOP_CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Validate branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          echo "Validando rama: $BRANCH"

          if [ "$BRANCH" = "master" ] || [ "$BRANCH" = "development" ]; then
            exit 0
          fi

          if [[ "$BRANCH" =~ ^(feature|hotfix|bug|release|refactor|docs|chore)\/.+$ ]]; then
            exit 0
          fi

          echo "Nombre de rama inválido"
          echo "Usa: feature/* hotfix/* bug/* release/* refactor/* docs/* chore/*"
          exit 1
  docker-image-build:
    name: docker-image-build (${{ matrix.image.name }})
    runs-on: ${{ vars.EOP_CI_RUNNER || 'ubuntu-latest' }}
    needs: validate-branch-name
    # Only on the PR that reaches development: a stacked PR is checked again there, and the image
    # builds are the most expensive jobs (pre-pr-check builds and measures them locally).
    if: github.base_ref == 'development'

    strategy:
      matrix:
        image:
          - name: eop-server
            context: .
            dockerfile: ./Dockerfile
            tag: eop-server:ci
          - name: hpc-engine
            context: .
            dockerfile: ./hpc-engine/Dockerfile
            tag: hpc-engine:ci
          - name: api-gateway
            context: ./services/go
            dockerfile: ./services/go/Dockerfile
            target: runtime
            tag: api-gateway:ci
          - name: external-stub
            context: ./services/go
            dockerfile: ./services/go/Dockerfile
            target: external-stub
            tag: external-stub:ci
          - name: mttr-watcher
            context: ./services/go
            dockerfile: ./services/go/Dockerfile
            target: mttr-watcher
            tag: mttr-watcher:ci
          - name: edge-ingestor
            context: ./services/go
            dockerfile: ./services/go/Dockerfile
            target: edge-ingestor
            tag: edge-ingestor:ci
          - name: edge-sim
            context: ./services/go
            dockerfile: ./services/go/Dockerfile
            target: edge-sim
            tag: edge-sim:ci
          - name: slo-traffic
            context: ./services/go
            dockerfile: ./services/go/Dockerfile
            target: slo-traffic
            tag: slo-traffic:ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: false
          load: true
          tags: ${{ matrix.image.tag }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Validate Docker image size ≤ 50 MB
        run: |
          SIZE_BYTES=$(docker inspect "${{ matrix.image.tag }}" \
            --format='{{.Size}}' 2>/dev/null)

          if [ -z "$SIZE_BYTES" ]; then
            echo "❌ Could not inspect image ${{ matrix.image.tag }}"
            exit 1
          fi

          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "Runtime image size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"

          MAX_MB=50
          if awk "BEGIN { exit !(${SIZE_MB} > ${MAX_MB}) }"; then
            echo "❌ FAILED: Image size ${SIZE_MB} MB exceeds limit of ${MAX_MB} MB"
            exit 1
          fi

          echo "✅ PASSED: Image size ${SIZE_MB} MB is within the ${MAX_MB} MB limit"

  k8s-manifest-lint:
    name: k8s-manifest-lint
    runs-on: ${{ vars.EOP_CI_RUNNER || 'ubuntu-latest' }}
    needs: validate-branch-name

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="0.6.7"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests (AC8)
        run: |
          # -kubernetes-version pinned to the team's local kind/minikube cluster version.
          # find covers k8s/*.yaml and k8s/jobs/*.yaml even though `kubectl apply -f k8s/`
          # itself does not recurse (Job specs are kept out of that default sweep).
          # kustomization.yaml files are build instructions, not cluster resources: they are
          # skipped here and every Kustomize directory is validated by its rendered output.
          kubeconform -strict -summary -kubernetes-version 1.30.0 $(find k8s -name '*.yaml' ! -name kustomization.yaml)
          # deploy/production (US-406, ADR-029) is the product: the whole stack in one render.
          for dir in $(find k8s -name kustomization.yaml -exec dirname {} \;) deploy/production; do
            echo "kustomize build $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -kubernetes-version 1.30.0 -
          done

  # -----------------------------------
  # API gateway (Go): format, vet, lint, race detector, coverage ≥ 90 % (US-301, ADR-010)
  # -----------------------------------
  go-gateway:
    name: go-gateway
    runs-on: ${{ vars.EOP_CI_RUNNER || 'ubuntu-latest' }}
    needs: validate-branch-name

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.mod
          cache-dependency-path: services/go/go.sum

      # Built with the same Go version as the module: a prebuilt binary built with an older
      # Go refuses to lint a module that targets a newer one.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: gofmt, golangci-lint
        run: make gateway-lint

      - name: go vet, unit tests with the race detector
        run: make gateway-test

      - name: Coverage threshold
        run: make gateway-coverage

  continuous-integration:
    # Pinned: on Ubuntu 26 (ubuntu-latest since 2026-10-19) libomp-dev no longer matches clang-18
    # and CMake cannot find OpenMP for the HPC engine.
    runs-on: ${{ vars.EOP_CI_RUNNER || 'ubuntu-24.04' }}
    needs: validate-branch-name

    # The Redis node registry tests (ADR-027) need a real Redis; without it they are skipped and
    # the coverage gate fails.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    env:
      BUILD_TYPE: Debug
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      ENABLE_SANITIZERS: "true"
      EOP_TEST_REDIS_HOST: 127.0.0.1
      EOP_TEST_REDIS_PORT: "6379"
      # Versión fija — misma que los alumnos tienen localmente
      CLANG_VERSION: "18"

    steps:
      # -----------------------------------
      # Checkout
      # -----------------------------------
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ninja-build \
            clang-${{ env.CLANG_VERSION }} \
            clang-tidy-${{ env.CLANG_VERSION }} \
            clang-format-${{ env.CLANG_VERSION }} \
            lcov \
            llvm-${{ env.CLANG_VERSION }} \
            libomp-dev \
            doxygen \
            graphviz \
            unzip \
            bc \
            ccache \
            python3-yaml

          # Crear symlinks versionados como nombres canónicos
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_VERSION }}        /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_VERSION }}      /usr/local/bin/clang++
          sudo ln -sf /usr/bin/clang-format-${{ env.CLANG_VERSION }} /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-${{ env.CLANG_VERSION }}   /usr/local/bin/clang-tidy
          sudo ln -sf /usr/bin/run-clang-tidy-${{ env.CLANG_VERSION }} /usr/local/bin/run-clang-tidy || true
          sudo ln -sf /usr/bin/llvm-cov-${{ env.CLANG_VERSION }}     /usr/local/bin/llvm-cov

          echo "clang-format version: $(clang-format --version)"
          echo "clang version:        $(clang --version | head -1)"

      # -----------------------------------
      # vcpkg (cached)
      # -----------------------------------
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          rm -rf vcpkg
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      # -----------------------------------
      # ccache
      # -----------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**', 'vcpkg.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: ccache stats before build
        run: |
          ccache --zero-stats || true
          ccache --show-stats || true

      # -----------------------------------
      # Clang Format
      # Aplica el .clang-format del repo con la versión fija.
      # Falla solo si hay diferencias reales (--dry-run --Werror).
      # -----------------------------------
      - name: Style Check
        id: style
        run: |
          FILES=$(find src include lib tests \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            -not -path '*/build/*' \
            | sort)

          if [ -z "$FILES" ]; then
            echo "No C++ files found — skipping."
            exit 0
          fi

          echo "Archivos a verificar:"
          echo "$FILES"

          # --Werror hace que el step falle si algún archivo no está formateado
          clang-format --dry-run --Werror $FILES

      # -----------------------------------
      # Docs
      # -----------------------------------
      - name: Generate Docs
        id: docs
        run: |
          if [ -f Doxyfile ]; then
            mkdir -p ./build/docs
            doxygen Doxyfile
          else
            echo "No Doxyfile found, skipping docs."
          fi

      - name: Upload Docs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ./build/docs
          if-no-files-found: ignore

      # -----------------------------------
      # Prepare flags
      # Coverage se inyecta via CMAKE_CXX_FLAGS para que afecte
      # tanto a cyberpunk_lib como a unit_tests en una sola pasada.
      # CMAKE_EXE_LINKER_FLAGS incluye --coverage para que el linker
      # resuelva __gcov_* en todos los targets ejecutables.
      # -----------------------------------
      - name: Prepare flags
        id: flags
        shell: bash
        run: |
          COMMON_FLAGS="-O0 -g -fno-omit-frame-pointer"
          SAN_FLAGS=""
          LINK_FLAGS=""
          COV_FLAGS="--coverage"

          if [ "${ENABLE_SANITIZERS}" = "true" ]; then
            SAN_FLAGS="-fsanitize=address,undefined"
            LINK_FLAGS="-fsanitize=address,undefined"
          fi

          FINAL_CXX_FLAGS="$COMMON_FLAGS $SAN_FLAGS $COV_FLAGS"
          FINAL_EXE_LINKER_FLAGS="$LINK_FLAGS $COV_FLAGS"
          FINAL_SHARED_LINKER_FLAGS="$LINK_FLAGS $COV_FLAGS"

          echo "FINAL_CXX_FLAGS=$FINAL_CXX_FLAGS"             >> $GITHUB_ENV
          echo "FINAL_EXE_LINKER_FLAGS=$FINAL_EXE_LINKER_FLAGS" >> $GITHUB_ENV
          echo "FINAL_SHARED_LINKER_FLAGS=$FINAL_SHARED_LINKER_FLAGS" >> $GITHUB_ENV

          echo "CXX FLAGS:            $FINAL_CXX_FLAGS"
          echo "EXE LINKER FLAGS:     $FINAL_EXE_LINKER_FLAGS"
          echo "SHARED LINKER FLAGS:  $FINAL_SHARED_LINKER_FLAGS"

      # -----------------------------------
      # Configure
      # -----------------------------------
      - name: Configure
        id: configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="${FINAL_CXX_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${FINAL_EXE_LINKER_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${FINAL_SHARED_LINKER_FLAGS}" \
            -DEXODUS_ENABLE_COVERAGE=OFF

      # -----------------------------------
      # Clang-Tidy
      # -----------------------------------
      - name: Static Analysis
        id: tidy
        run: |
          run-clang-tidy -p build > tidy_output.txt || true

      # -----------------------------------
      # Build
      # -----------------------------------
      - name: Build
        id: build
        run: cmake --build build --parallel

      - name: ccache stats after build
        if: always()
        run: ccache --show-stats || true

      # -----------------------------------
      # Run Tests
      # -----------------------------------
      - name: Run Tests
        id: tests
        env:
          ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1:strict_init_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set +e
          ctest --test-dir build --output-on-failure --parallel 2 | tee test_output.txt
          RC=$?
          echo "EXIT_CODE=$RC" >> $GITHUB_ENV
          set -e
          exit $RC

      - name: Parse Test Results
        id: testparse
        if: always()
        run: |
          FAILED=$(grep -oP "\d+ tests failed" test_output.txt || true)
          echo "FAILED_TESTS=${FAILED:-0 tests failed}" >> $GITHUB_ENV

      # -----------------------------------
      # API gateway against the real eop_server (US-301 AC8)
      # -----------------------------------
      # Runs here because this job already built eop_server; the Go unit tests, lint and
      # coverage gate run in the go-gateway job.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/go/go.mod
          cache-dependency-path: services/go/go.sum

      - name: API gateway integration tests
        run: |
          make gateway-integration-test \
            EOP_SERVER_BIN=${{ github.workspace }}/build/eop_server \
            EOP_HPC_ENGINE_BIN=${{ github.workspace }}/build/hpc-engine/hpc_engine

      # -----------------------------------
      # Dashboard Contract Tests (US-205 AC7 / US-206)
      # -----------------------------------
      # Static checks against the committed dashboard JSON + provisioning files — no running
      # Grafana/Prometheus needed. Kept out of ctest (they're plain make targets, not gtest),
      # but cheap enough to run on every PR.
      - name: Dashboard Contract Tests
        run: |
          make slo-dashboard-test
          make hpc-dashboard-test
          make edge-dashboard-test
          make vault-tec-dashboard-test
          make production-config-test
          make edge-load-tool-test
          make sla-export-tool-test
          make loki-test

      # Canary and blue-green layouts as rendered by Kustomize (selectors, Services, Ingress), the
      # load tool that measures rollouts and the smoke suite that gates the blue-green switch
      # (US-304, US-305, ADR-011). kubectl is preinstalled on the runner.
      - name: Gateway Delivery Tests
        run: |
          make gateway-overlays-test
          make gateway-load-tool-test
          make gateway-smoke-suite-test

      # -----------------------------------
      # Benchmark Report analysis (US-202 AC5/AC6)
      # -----------------------------------
      # The benchmark itself takes hours and needs 8 physical cores, so it cannot run here. What
      # can is the analysis that turns its measurements into the report -- Amdahl fit, "when not
      # to parallelize", AC verdicts -- tested on synthetic data and on a real past run.
      - name: Benchmark Report Analysis Tests
        run: make benchmark-report-test

      # -----------------------------------
      # Coverage (lcov + llvm-cov)
      # -----------------------------------
      - name: Generate Coverage
        id: coverage
        if: always()
        run: |
          cat > llvm-gcov.sh <<'EOF'
          #!/usr/bin/env bash
          exec llvm-cov gcov "$@"
          EOF
          chmod +x llvm-gcov.sh

          lcov --capture \
            --directory build \
            --output-file coverage.info \
            --gcov-tool "$(pwd)/llvm-gcov.sh" \
            --ignore-errors inconsistent,mismatch,format,unsupported,empty

          lcov --remove coverage.info \
            '/usr/*' \
            '*/build/vcpkg_installed/*' \
            '*/tests/*' \
            '*/test/*' \
            --ignore-errors inconsistent,unused,format,unsupported \
            --output-file coverage.info

          lcov --list coverage.info --ignore-errors inconsistent | tee coverage_list.txt

      - name: Generate Coverage HTML
        if: always()
        run: |
          mkdir -p coverage_html
          genhtml coverage.info \
            --output-directory coverage_html \
            --ignore-errors inconsistent,format,unsupported || true

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.info
            coverage_html
            coverage_list.txt
            coverage_summary.txt
          if-no-files-found: ignore

      - name: Coverage Summary
        id: cov
        if: always()
        run: |
          if [ ! -f coverage.info ]; then
            echo "COVERAGE_PCT=0"        >> $GITHUB_ENV
            echo "LINES_COVERAGE=0"     >> $GITHUB_ENV
            echo "FUNCTIONS_COVERAGE=0" >> $GITHUB_ENV
            {
              echo "## Coverage Report"
              echo
              echo "| Metric | Value |"
              echo "|---|---:|"
              echo "| Lines | 0% |"
              echo "| Functions | 0% |"
              echo "| Score usado por CI | 0% |"
              echo "| Threshold | ${COVERAGE_THRESHOLD}% |"
            } > coverage_comment.md
            exit 0
          fi

          lcov --summary coverage.info --ignore-errors inconsistent,format,unsupported | tee coverage_summary.txt

          LINES=$(grep -E '^  lines\.*:' coverage_summary.txt \
            | sed -E 's/.*: ([0-9]+(\.[0-9]+)?)%.*/\1/' | head -n1)
          FUNCS=$(grep -E '^  functions\.*:' coverage_summary.txt \
            | sed -E 's/.*: ([0-9]+(\.[0-9]+)?)%.*/\1/' | head -n1)

          LINES=${LINES:-0}
          FUNCS=${FUNCS:-0}
          WORST=$(awk "BEGIN { if ($LINES < $FUNCS) print $LINES; else print $FUNCS; }")

          echo "LINES_COVERAGE=$LINES"     >> $GITHUB_ENV
          echo "FUNCTIONS_COVERAGE=$FUNCS" >> $GITHUB_ENV
          echo "COVERAGE_PCT=$WORST"       >> $GITHUB_ENV

          {
            echo "## Coverage Report"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Lines | ${LINES}% |"
            echo "| Functions | ${FUNCS}% |"
            echo "| Score usado por CI | ${WORST}% |"
            echo "| Threshold | ${COVERAGE_THRESHOLD}% |"
          } > coverage_comment.md

      - name: Validate Coverage Threshold
        if: always()
        run: |
          echo "Threshold:          ${COVERAGE_THRESHOLD}%"
          echo "Lines coverage:     ${LINES_COVERAGE:-0}%"
          echo "Functions coverage: ${FUNCTIONS_COVERAGE:-0}%"

          if ! awk "BEGIN {exit !(${LINES_COVERAGE:-0} >= ${COVERAGE_THRESHOLD})}"; then
            echo "FAILED: Lines coverage ${LINES_COVERAGE:-0}% < ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

          if ! awk "BEGIN {exit !(${FUNCTIONS_COVERAGE:-0} >= ${COVERAGE_THRESHOLD})}"; then
            echo "FAILED: Functions coverage ${FUNCTIONS_COVERAGE:-0}% < ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

          echo "PASSED: Coverage threshold satisfied"

      # -----------------------------------
      # Sanitizer summary
      # -----------------------------------
      - name: Sanitizer summary
        if: always()
        run: |
          {
            echo "## Sanitizers"
            echo
            if [ "${ENABLE_SANITIZERS}" = "true" ]; then
              echo "- AddressSanitizer: enabled"
              echo "- UndefinedBehaviorSanitizer: enabled"
            else
              echo "- Sanitizers: disabled"
            fi
          } > sanitizer_comment.md

      - name: Count clang-tidy warnings
        id: tidy_count
        if: always()
        run: |
          WARN=$(grep -c "warning:" tidy_output.txt || true)
          echo "TIDY_WARNINGS=$WARN" >> $GITHUB_ENV

      # -----------------------------------
      # Upload logs
      # -----------------------------------
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            test_output.txt
            tidy_output.txt
          if-no-files-found: ignore

      # -----------------------------------
      # Coverage + Sanitizers comment on PR
      # -----------------------------------
      - name: Comment Coverage Report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = "## Coverage Report";

            let coverageBody = fs.existsSync("coverage_comment.md")
              ? fs.readFileSync("coverage_comment.md", "utf8")
              : "## Coverage Report\n\nNo coverage data available.";

            let sanitizerBody = fs.existsSync("sanitizer_comment.md")
              ? fs.readFileSync("sanitizer_comment.md", "utf8")
              : "";

            const body = `${coverageBody}\n\n${sanitizerBody}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            const previous = comments.data.find(c =>
              c.user?.type === "Bot" && c.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      # -----------------------------------
      # PR Bot
      # -----------------------------------
      - name: 🤖 PR Bot (smart, ES)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          STYLE_OUTCOME:     ${{ steps.style.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          BUILD_OUTCOME:     ${{ steps.build.outcome }}
          TESTS_OUTCOME:     ${{ steps.tests.outcome }}
          DOCS_OUTCOME:      ${{ steps.docs.outcome }}
          COV_OUTCOME:       ${{ steps.cov.outcome }}
          LINES_COVERAGE:    ${{ env.LINES_COVERAGE }}
          FUNCTIONS_COVERAGE: ${{ env.FUNCTIONS_COVERAGE }}
          COVERAGE_PCT:      ${{ env.COVERAGE_PCT }}
          TIDY_WARNINGS:     ${{ env.TIDY_WARNINGS }}
          FAILED_TESTS:      ${{ env.FAILED_TESTS }}
        with:
          script: |
            const styleOk = process.env.STYLE_OUTCOME === "success";
            const cfgOk   = process.env.CONFIGURE_OUTCOME === "success";
            const buildOk = process.env.BUILD_OUTCOME === "success";
            const testsOk = process.env.TESTS_OUTCOME === "success";
            const docsOk  = (process.env.DOCS_OUTCOME || "success") === "success";
            const covOk   = (process.env.COV_OUTCOME || "success") === "success";

            const cov      = parseFloat(process.env.COVERAGE_PCT || "0");
            const lineCov  = parseFloat(process.env.LINES_COVERAGE || "0");
            const funcCov  = parseFloat(process.env.FUNCTIONS_COVERAGE || "0");
            const tidyWarn = parseInt(process.env.TIDY_WARNINGS || "0", 10);
            const failedTests = process.env.FAILED_TESTS || "0 tests failed";

            let score = 0;
            score += styleOk ? 20 : 0;
            score += (cfgOk && buildOk) ? 20 : 0;
            score += testsOk ? 20 : 0;
            score += (cov >= 90 ? 20 : cov >= 80 ? 18 : cov >= 50 ? 10 : cov >= 20 ? 5 : 0);
            score += (tidyWarn === 0 ? 20 : tidyWarn <= 10 ? 15 : tidyWarn <= 30 ? 10 : 0);

            let failed = null;
            if (!styleOk)  failed = "style";
            else if (!cfgOk)   failed = "configure";
            else if (!buildOk) failed = "build";
            else if (!testsOk) failed = "tests";
            else if (!covOk)   failed = "coverage";
            else if (!docsOk)  failed = "docs";

            const hints = {
              style: [
                "Ejecutá `clang-format-18 --dry-run --Werror` localmente sobre src/, include/ y tests/.",
                "Verificá que tu editor use el .clang-format del repo (BreakBeforeBraces: Allman, IndentWidth: 4).",
                "Tip: `clang-format-18 -i $(find src include tests -name '*.cpp' -o -name '*.hpp')` para formatear todo."
              ],
              configure: [
                "Revisá VCPKG_ROOT, dependencias en vcpkg.json y CMakeLists.txt.",
                "Probá borrar build/ y reconfigurar desde cero."
              ],
              build: [
                "Si falla al linkear, revisá target_link_libraries y bibliotecas faltantes.",
                "Verificá includes, firmas y símbolos no resueltos."
              ],
              tests: [
                "Revisá casos borde, precondiciones y tests frágiles.",
                `Resumen detectado: ${failedTests}.`
              ],
              coverage: [
                "Agregá tests para caminos felices y casos borde.",
                "Revisá coverage_list.txt para ver qué archivos quedaron con baja cobertura.",
                "El threshold es 100% — cada línea y función debe tener al menos un test."
              ],
              docs: [
                "Si hay cambios en API o comportamiento, actualizá documentación y comentarios."
              ]
            };

            function take(arr, max = 5) {
              return (arr || []).slice(0, max).map(x => `- ${x}`).join("\n");
            }

            let body = "## 🤖 Reporte de CI — Cyberpunk Córdoba 2077\n\n";
            body += `**Quality Score:** **${score}/100**\n\n`;
            body += `| Check | Estado |\n`;
            body += `|---|---|\n`;
            body += `| 🎨 Estilo (clang-format-18) | ${styleOk ? "✅" : "❌"} |\n`;
            body += `| ⚙️ Configure + Build | ${(cfgOk && buildOk) ? "✅" : "❌"} |\n`;
            body += `| 🧪 Tests | ${testsOk ? "✅" : "❌"} |\n`;
            body += `| 📈 Coverage mínimo | ${cov.toFixed(1)}% |\n`;
            body += `| 📏 Lines coverage | ${lineCov.toFixed(1)}% |\n`;
            body += `| 🧩 Functions coverage | ${funcCov.toFixed(1)}% |\n`;
            body += `| 🧼 clang-tidy warnings | ${tidyWarn} |\n\n`;

            if (!failed) {
              body += "✅ **Todo OK.** Tu PR pasó el pipeline completo.\n\n";
              body += "> En 2077, tu código sobrevivió.\n";
            } else {
              const titles = {
                style:     "🎨 Estilo / Formato",
                configure: "⚙️ Configuración (CMake/vcpkg)",
                build:     "🏗️ Compilación / Linkeo",
                tests:     "🧪 Tests",
                coverage:  "📈 Coverage",
                docs:      "📚 Documentación"
              };

              body += `❌ **Falló la etapa:** **${titles[failed] || failed}**\n\n`;
              body += "### Pistas para arreglarlo\n";
              body += take(hints[failed], 5) + "\n\n";
              body += "📌 Revisá los logs del step fallido en GitHub Actions para el error exacto.\n";
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            const marker = "## 🤖 Reporte de CI — Cyberpunk Córdoba 2077";
            const previous = comments.data.find(c =>
              c.user?.type === "Bot" && c.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

  thread-sanitizer:
    name: thread-sanitizer
    # Pinned: on Ubuntu 26 (ubuntu-latest since 2026-10-19) libomp-dev no longer matches clang-18
    # and CMake cannot find OpenMP for the HPC engine.
    runs-on: ${{ vars.EOP_CI_RUNNER || 'ubuntu-24.04' }}
    needs: validate-branch-name

    # The Redis node registry tests (ADR-027) need a real Redis; without it they are skipped and
    # the coverage gate fails.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    env:
      BUILD_TYPE: Debug
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_VERSION: "18"
      EOP_TEST_REDIS_HOST: 127.0.0.1
      EOP_TEST_REDIS_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ninja-build \
            clang-${{ env.CLANG_VERSION }} \
            libomp-dev \
            unzip \
            ccache

          # Crear symlinks versionados como nombres canónicos
          sudo ln -sf /usr/bin/clang-${{ env.CLANG_VERSION }}        /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-${{ env.CLANG_VERSION }}      /usr/local/bin/clang++

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          rm -rf vcpkg
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tsan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**', 'vcpkg.json') }}
          restore-keys: |
            ccache-tsan-${{ runner.os }}-

      - name: Configure CMake with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEXODUS_ENABLE_TSAN=ON \
            -DEXODUS_ENABLE_ASAN=OFF \
            -DEXODUS_ENABLE_COVERAGE=OFF

      - name: Build tests
        run: cmake --build build-tsan --parallel

      - name: Run tests under ThreadSanitizer
        env:
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1"
        run: |
          ctest --test-dir build-tsan --output-on-failure --parallel 2