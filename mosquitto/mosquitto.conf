# Eclipse Mosquitto for local development (ADR-013): plain MQTT on 1883 and persistence, so
# QoS 1 messages queued for a disconnected persistent session survive a broker restart.
# The production broker (TLS listener for devices) is the Kubernetes one.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
