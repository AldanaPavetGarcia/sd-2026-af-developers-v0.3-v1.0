# EOP edge firmware, settings shared by every board. Device identity, broker and topic prefix
# are here too (US-401 AC7); see Kconfig for what each option means.
CONFIG_EOP_NODE_ID="vault-101"
CONFIG_EOP_BUNKER_NAME="Vault-101"
CONFIG_EOP_MQTT_BROKER_HOST="mosquitto"
CONFIG_EOP_MQTT_BROKER_PORT=1883
CONFIG_EOP_MQTT_TOPIC_PREFIX="eop/bunker"

# Kernel
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_ENTROPY_GENERATOR=y

# Networking and MQTT
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_MQTT_LIB=y

# A fatal kernel error reboots the device (US-403 AC4); the status LED is a GPIO (AC5)
CONFIG_REBOOT=y
CONFIG_GPIO=y

# Logs and the `eop status` shell command (US-401 AC8)
CONFIG_LOG=y
CONFIG_SHELL=y
