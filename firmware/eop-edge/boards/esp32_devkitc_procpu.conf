# ESP32-DevKitC (ADR-014): the board the firmware targets once one is available. WiFi station
# with DHCP, DNS for the broker name, SNTP for the wall clock (src/platform_sntp.c). The network
# name and password come from an untracked overlay: see README "ESP32 build".
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_UDP=y

# The PRD's thread stacks (ADR-014) are the Kconfig defaults; the WiFi stack needs more heap.
CONFIG_HEAP_MEM_POOL_SIZE=16384
