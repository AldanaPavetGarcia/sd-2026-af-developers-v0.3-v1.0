# native_sim (ADR-014 "Running without an ESP32"): the host's sockets through Native Simulator
# offloaded sockets, so no TAP interface or root is needed, and the shell on stdin/stdout.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Host stack frames are larger than the ESP32's: the PRD's 512 / 2048 bytes are not enough here.
CONFIG_EOP_SENSOR_STACK_SIZE=4096
CONFIG_EOP_MQTT_STACK_SIZE=8192

# Logs go to stdout through the UART backend only: the shell's own log backend would print every
# line a second time. No colours, so container logs read cleanly in Loki.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_SHELL_VT100_COLORS=n
