# TLS to the broker's device listener (ADR-013): add with -DEXTRA_CONF_FILE=tls.conf and give the
# broker's CA with -DEOP_MQTT_CA_CERT=<path to ca.crt> (make edge-certs creates it). README, "TLS".
CONFIG_EOP_MQTT_TLS=y
CONFIG_EOP_MQTT_BROKER_PORT=8883

CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y

# Mbed TLS: TLS 1.2 with the suite the broker offers first (ECDHE-RSA-AES128-GCM-SHA256), the
# broker's certificate checked against the CA in PEM.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048

# The handshake runs on the MQTT thread.
CONFIG_EOP_MQTT_STACK_SIZE=8192
