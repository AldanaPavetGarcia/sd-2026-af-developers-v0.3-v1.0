apiVersion: v1
kind: ConfigMap
metadata:
  name: eop-global-config
  labels:
    app: eop-server
data:
  EOP_PORT: "9026"
  # Prometheus /metrics HTTP exposer (US-205 / ADR-009) — read directly from the environment in
  # InitMetrics(), no config.env fallback (see include/eopServer.hpp / src/app/eopServer.cpp).
  EOP_METRICS_PORT: "9100"
  # Prometheus /metrics HTTP exposer for hpc-engine.
  EOP_HPC_METRICS_PORT: "9101"
  EOP_IDLE_TIMEOUT: "30"
  EOP_MAX_CLIENTS: "100"
  EOP_HEARTBEAT_INTERVAL: "5"
  # Shared node registry and failover (ADR-027): two eop-server replicas keep the registry in
  # Redis; each one's lease lasts EOP_REGISTRY_LEASE_TTL_MS. EOP_READY_PORT is open only while the
  # registry answers and the replica is not shutting down (readinessProbe); on SIGTERM the replica
  # keeps serving for EOP_SHUTDOWN_DRAIN_MS after leaving the Service, so no client is refused.
  EOP_REGISTRY_BACKEND: "redis"
  EOP_REDIS_HOST: "redis"
  EOP_REDIS_PORT: "6379"
  EOP_REDIS_TIMEOUT_MS: "200"
  EOP_REGISTRY_LEASE_TTL_MS: "3000"
  EOP_REGISTRY_LEASE_REFRESH_MS: "1000"
  EOP_READY_PORT: "9027"
  EOP_SHUTDOWN_DRAIN_MS: "3000"
  # In-cluster DNS name of the eop-server Service (see service.yaml), for clients outside the
  # server Pod (the hpc-engine batch Job). The sidecar engine connects to 127.0.0.1 instead.
  EOP_SERVER_HOST: "eop-server"
  # US-201 AC3 measures latency at 4 threads specifically; must stay <= the hpc-engine sidecar's
  # CPU limit (deployment.yaml), otherwise OpenMP defaults to the host's core count and
  # oversubscribes under the cgroup CPU quota.
  OMP_NUM_THREADS: "4"
  # ADR-024 (option D): exact below this, pivot-sampled above it. 10,000 is US-201 AC3's own
  # graph size, so the AC is met without approximating anything; sampling only kicks in for
  # graphs larger than any AC's latency figure names (see hpc-engine/include/hpc/centrality.hpp).
  EOP_HPC_CENTRALITY_EXACT_MAX_NODES: "10000"
  HPC_NODE_ID: "hpc-engine"
  HPC_BUNKER_NAME: "HPC-K8S"
  HPC_CAPACITY: "1"
  # US-203 AC5 / US-206 AC5: without this, eop-server falls back to its localhost:4318 default
  # (src/app/eopServer.cpp), which doesn't exist in-cluster -- every span export silently fails.
  # Points at the otel-collector Service (otel-collector-deployment.yaml), which forwards to
  # signoz-otel-collector and from there into ClickHouse, same chain as docker-compose.yml.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  # US-206 AC1/AC4 (speedup ratio panel + P99-vs-baseline alert). Taken directly from the OpenMP
  # Benchmark Report (US-202 AC5, hpc-engine/benchmarks/BENCHMARK_REPORT.md), 10,000-node graph,
  # single thread, worst of 3 measured runs as a conservative P99 substitute (6.744 s) -- see
  # ADR-023 for why this must be a real measurement rather than an estimate, and why it is only
  # published for requests whose graph size falls within the tolerance band below.
  EOP_HPC_BASELINE_P99_MS: "6744"
  EOP_HPC_BASELINE_GRAPH_NODES: "10000"
  EOP_HPC_BASELINE_BAND_PERCENT: "20"
