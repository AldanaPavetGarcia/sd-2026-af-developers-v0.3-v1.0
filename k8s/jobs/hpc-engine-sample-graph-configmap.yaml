apiVersion: v1
kind: ConfigMap
metadata:
  name: hpc-engine-sample-graph
  labels:
    app: hpc-engine
data:
  # Minimal ANALYZE_GRAPH batch-mode request matching the schema hpc::parseRequest /
  # hpc::validateGraph expect (docs/analyze-graph-protocol-v0.2.md): top-level
  # type/request_id, payload.{nodes,edges,algorithms}. 5 nodes / 6 edges, one
  # connected component, exercised via `make k8s-hpc-batch-demo`.
  graph.json: |
    {
      "type": "ANALYZE_GRAPH",
      "request_id": "k8s-batch-demo-001",
      "payload": {
        "nodes": ["a", "b", "c", "d", "e"],
        "edges": [
          {"from": "a", "to": "b", "weight": 1},
          {"from": "b", "to": "c", "weight": 2},
          {"from": "c", "to": "d", "weight": 1},
          {"from": "d", "to": "e", "weight": 3},
          {"from": "e", "to": "a", "weight": 2},
          {"from": "b", "to": "d", "weight": 4}
        ],
        "algorithms": ["shortest_paths", "connected_components"]
      }
    }
