# Steady synthetic load of the 30-day SLO run (#67, docs/slo-30-day-run.md). Not part of the
# `kubectl apply -f k8s/` sweep: it only runs where `make slo-run-start` deploys it (the 14-core
# machine). About 1.3 requests per second in total: three bunker nodes registered with heartbeats,
# API reads through the gateway and a small graph analysis every 5 minutes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-traffic-config
  labels:
    app: slo-traffic
data:
  EOP_TRAFFIC_GATEWAY_URL: "http://api-gateway"
  EOP_TRAFFIC_GATEWAY_PATHS: "/v1/health,/v1/nodes,/v1/nodes/{node}"
  EOP_TRAFFIC_GATEWAY_INTERVAL: "1s"
  EOP_TRAFFIC_ANALYZE_INTERVAL: "5m"
  EOP_TRAFFIC_SERVER_ADDR: "eop-server:9026"
  EOP_TRAFFIC_NODES: "3"
  EOP_TRAFFIC_NODE_PREFIX: "slo-bunker-"
  # Below eop-server's heartbeat timeout (2 × EOP_HEARTBEAT_INTERVAL = 10 s).
  EOP_TRAFFIC_HEARTBEAT_INTERVAL: "5s"
  EOP_TRAFFIC_REQUEST_TIMEOUT: "5s"
  EOP_TRAFFIC_SUMMARY_EVERY: "10m"
  EOP_TRAFFIC_METRICS_ADDR: ":9103"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slo-traffic
  labels:
    app: slo-traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slo-traffic
  template:
    metadata:
      labels:
        app: slo-traffic
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9103"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slo-traffic
          image: slo-traffic:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: slo-traffic-config
          ports:
            - name: metrics
              containerPort: 9103
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
