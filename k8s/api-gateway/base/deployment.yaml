apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: "0.3.0"
        track: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9100"
    spec:
      # preStop sleep (5 s) + EOP_GATEWAY_SHUTDOWN_TIMEOUT (15 s) + margin.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: api-gateway:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            # Version and track come from the pod labels, so metrics and traces split by
            # version without a second source of truth (ADR-011).
            - name: EOP_GATEWAY_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']
            - name: EOP_GATEWAY_TRACK
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['track']
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Gives the endpoint controller and ingress-nginx time to stop routing to this pod
            # before it stops accepting connections (ADR-011 §5). Native sleep: the distroless
            # image has no shell.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "48Mi"
            limits:
              cpu: "250m"
              # Large analysis results (tens of MB) pass through the gateway once per job.
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: breaker-settings
              mountPath: /etc/api-gateway/breaker
              readOnly: true
      volumes:
        - name: breaker-settings
          configMap:
            name: api-gateway-breaker
