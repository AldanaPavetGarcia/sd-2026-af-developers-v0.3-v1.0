apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  labels:
    app: api-gateway
data:
  EOP_SERVER_ADDR: "eop-server:9026"
  # Below eop-server's EOP_IDLE_TIMEOUT (30 s in k8s/configmap.yaml), so a pooled connection is
  # never reused after the server closed it; the pool stays well below EOP_MAX_CLIENTS (100).
  EOP_SERVER_POOL_IDLE_TIMEOUT: "20s"
  EOP_SERVER_POOL_SIZE: "8"
  EOP_SERVER_DIAL_TIMEOUT: "2s"
  EOP_SERVER_REQUEST_TIMEOUT: "3s"
  EOP_GATEWAY_HEALTH_TIMEOUT: "1s"
  # Graph analysis (US-302). Jobs live in Redis so any replica answers a poll (ADR-010 §5).
  EOP_REDIS_ADDR: "redis:6379"
  EOP_GATEWAY_ASYNC_MIN_NODES: "1000"
  EOP_GATEWAY_SYNC_ANALYZE_TIMEOUT: "5s"
  # Above eop-server's EOP_HPC_TIMEOUT_MS (5 s default, 60 s maximum).
  EOP_SERVER_ANALYZE_TIMEOUT: "65s"
  EOP_GATEWAY_JOB_WORKERS: "1"
  EOP_GATEWAY_JOB_QUEUE: "16"
  EOP_GATEWAY_JOB_RESULT_TTL: "5m"
  EOP_GATEWAY_JOB_MAX_AGE: "30m"
  # External services behind circuit breakers (US-303, ADR-012).
  EOP_AI_SERVICE_URL: "http://ai-service:8090"
  EOP_CORPORATE_SERVICE_URL: "http://corporate-service:8090"
  EOP_GATEWAY_BREAKER_SETTINGS: "/etc/api-gateway/breaker/breaker.yaml"
  EOP_GATEWAY_BREAKER_RELOAD_INTERVAL: "10s"
  # Must fit inside terminationGracePeriodSeconds together with the preStop sleep.
  EOP_GATEWAY_SHUTDOWN_TIMEOUT: "15s"
  EOP_TRACING_ENABLED: "1"
  OTEL_SERVICE_NAME: "api-gateway"
  # Signal-specific variable: used as-is. The generic OTEL_EXPORTER_OTLP_ENDPOINT of
  # eop-global-config already ends in /v1/traces, which the Go SDK would append again.
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
