# The stable track: the version serving all traffic outside a rollout (ADR-011 §2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/deployment
nameSuffix: -stable
patches:
  # The track label joins the selector so the two Deployments never select each other's pods.
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/selector/matchLabels/track
        value: stable
      - op: replace
        path: /spec/template/metadata/labels/track
        value: stable
