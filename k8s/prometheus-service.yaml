apiVersion: v1
kind: Service
metadata:
  # Name must stay "prometheus" — monitoring/grafana/provisioning/datasources/
  # prometheus-datasource.yaml hardcodes url: http://prometheus:9090, same hostname
  # docker-compose.yml's "prometheus" service already relies on.
  name: prometheus
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
