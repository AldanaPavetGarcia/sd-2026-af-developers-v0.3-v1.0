apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpc-engine
  labels:
    app: hpc-engine
    mode: persistent
spec:
  # eopServer.cpp's hpcDispatchMutex serializes all ANALYZE_GRAPH dispatch
  # globally today, so more replicas would not add throughput — do not scale
  # this beyond 1 without revisiting that serialization (tracked for #18).
  replicas: 1
  # RollingUpdate's default surge (maxSurge rounds up to 1 pod even at
  # replicas=1) briefly runs old+new Pods together. Both would register with
  # the same static HPC_NODE_ID, and eop-server rejects the second REGISTER
  # as ERROR_DUPLICATE — the new Pod can never become Ready, so the old one
  # (held by maxUnavailable=0) never gets removed either: a permanent rollout
  # deadlock. Recreate avoids the overlap entirely by design.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hpc-engine
  template:
    metadata:
      labels:
        app: hpc-engine
        mode: persistent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9101"
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 20
      containers:
        - name: hpc-engine
          image: hpc-engine:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: eop-global-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: metrics
              containerPort: 9101
              protocol: TCP
          # hpc-engine is a pure outbound TCP client for ANALYZE_GRAPH traffic,
          # but exposes /metrics for Prometheus scraping.
          # --server-port is passed explicitly because the CLI default (9090)
          # does not match eop-server's real Service port (EOP_PORT=9026).
          args:
            - "--server-host"
            - "$(EOP_SERVER_HOST)"
            - "--server-port"
            - "$(EOP_PORT)"
            - "--node-id"
            - "$(HPC_NODE_ID)"
            - "--bunker-name"
            - "$(HPC_BUNKER_NAME)"
            - "--ip-address"
            - "$(POD_IP)"
            - "--capacity"
            - "$(HPC_CAPACITY)"
          # No listening port to probe: liveness checks the process is PID 1
          # (valid because the Dockerfile's exec-form ENTRYPOINT makes
          # hpc_engine PID 1), readiness checks the heartbeat file hpc_engine
          # writes every 5s only while registered and holding a session.
          # Readiness doesn't gate any Service traffic today (no Service
          # fronts hpc-engine) but still drives `kubectl rollout status`,
          # `make k8s-apply`'s wait, and the Ready column in `kubectl get pods`.
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -qi hpc_engine /proc/1/comm"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  [ -f /tmp/hpc-engine-heartbeat ] && \
                  [ $(( $(date +%s) - $(cat /tmp/hpc-engine-heartbeat) )) -lt 20 ]
            # Generous failureThreshold: covers the worst-case bounded
            # connect-retry window (up to 5 attempts w/ backoff) before the
            # first heartbeat write.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            # CPU-bound (OpenMP graph algorithms). limits.cpu tracks OMP_NUM_THREADS in
            # eop-global-config (US-201 AC3: 4 threads) -- below it OpenMP throttles under the
            # cgroup CPU quota regardless of what OMP_NUM_THREADS asks for.
            #
            # limits.memory is sized from measured peak RSS, not guessed: a 100,000-node graph
            # (pivot-sampled above the ADR-024 threshold) peaked at ~309 MiB with 8 threads and
            # ~287 MiB at the 4 threads this Deployment actually runs with; a 10,000-node exact
            # request (US-201 AC3's own size) peaked at ~38 MiB. 512Mi leaves headroom above the
            # largest measured case for JSON parsing/serialization buffers on top of it.
            requests:
              cpu: "500m"
              memory: "192Mi"
            limits:
              cpu: "4"
              memory: "512Mi"
