# Stand-ins for Vault-Tec's external AI and corporate services (ADR-012 §1, US-303). One image,
# two Deployments. For the demo, "stop the external service" is
#   kubectl scale deployment/ai-service --replicas=0
# and failures can also be injected at runtime:
#   kubectl port-forward svc/ai-service 8090 && curl -X POST localhost:8090/admin/fault -d '{"mode":"error"}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
    role: external-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        role: external-stub
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: external-stub:local
          imagePullPolicy: IfNotPresent
          env:
            - name: EOP_STUB_SERVICE
              value: ai
            - name: EOP_STUB_FAULT
              value: ok
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - name: http
      port: 8090
      targetPort: http
---
