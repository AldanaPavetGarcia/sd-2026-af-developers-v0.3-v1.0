x-common: &common
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"

x-clickhouse-defaults: &clickhouse-defaults
  <<: *common
  image: clickhouse/clickhouse-server:25.5.6
  tty: true
  depends_on:
    init-clickhouse:
      condition: service_completed_successfully
    zookeeper-1:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1

x-zookeeper-defaults: &zookeeper-defaults
  <<: *common
  image: signoz/zookeeper:3.7.1
  user: root
  healthcheck:
    test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

x-db-depend: &db-depend
  <<: *common
  depends_on:
    clickhouse:
      condition: service_healthy

services:
  init-clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:25.5.6
    container_name: eop-signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    restart: on-failure
    volumes:
      - eop-signoz-clickhouse-user-scripts:/var/lib/clickhouse/user_scripts/

  zookeeper-1:
    <<: *zookeeper-defaults
    container_name: eop-signoz-zookeeper-1
    volumes:
      - eop-signoz-zookeeper-1:/bitnami/zookeeper
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141

  clickhouse:
    <<: *clickhouse-defaults
    container_name: eop-signoz-clickhouse
    ports:
      - "8123:8123"
    volumes:
      - ./monitoring/signoz-common/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./monitoring/signoz-common/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./monitoring/signoz-common/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./monitoring/signoz-common/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - eop-signoz-clickhouse-user-scripts:/var/lib/clickhouse/user_scripts/
      - eop-signoz-clickhouse:/var/lib/clickhouse/

  signoz-telemetrystore-migrator:
    <<: *db-depend
    image: signoz/signoz-otel-collector:v0.144.4
    container_name: eop-signoz-telemetrystore-migrator
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    restart: on-failure

  signoz:
    <<: *db-depend
    image: signoz/signoz:v0.126.0
    container_name: eop-signoz
    ports:
      - "8081:8080"
    volumes:
      - eop-signoz-sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      - SIGNOZ_TOKENIZER_JWT_SECRET=secret
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  signoz-otel-collector:
    <<: *common
    image: signoz/signoz-otel-collector:v0.144.4
    container_name: eop-signoz-otel-collector
    depends_on:
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    entrypoint: ["/signoz-otel-collector"]
    command:
      - "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=eop-signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':10DD' /proc/net/tcp /proc/net/tcp6 && grep -qi ':10DE' /proc/net/tcp /proc/net/tcp6"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  otel-collector:
    <<: *common
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: eop-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/eop-otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      signoz-otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  eop-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: eop-server:local
    container_name: eop-server
    environment:
      EOP_PORT: "9026"
      EOP_METRICS_PORT: "9100"
      EOP_IDLE_TIMEOUT: "30"
      EOP_MAX_CLIENTS: "100"
      EOP_HEARTBEAT_INTERVAL: "5"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
    ports:
      - "9026:9026"
      - "9100:9100"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9026"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # US-301 (#51): public REST API in front of eop-server (ADR-010). Metrics go to host port
  # 9101 because eop-server already publishes 9100.
  api-gateway:
    <<: *common
    build:
      context: services/go
      dockerfile: Dockerfile
    image: api-gateway:local
    container_name: eop-api-gateway
    environment:
      EOP_SERVER_ADDR: "eop-server:9026"
      EOP_SERVER_POOL_IDLE_TIMEOUT: "20s"
      EOP_GATEWAY_VERSION: "0.3.0"
      EOP_GATEWAY_TRACK: "stable"
      OTEL_SERVICE_NAME: "api-gateway"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
      EOP_REDIS_ADDR: "redis:6379"
      EOP_AI_SERVICE_URL: "http://ai-service:8090"
      EOP_CORPORATE_SERVICE_URL: "http://corporate-service:8090"
    ports:
      - "8080:8080"
      - "9101:9100"
    depends_on:
      eop-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # US-303 (#53): stand-ins for the external AI and corporate services (ADR-012 §1). Stop one
  # with `docker compose stop ai-service`, or inject failures through POST /admin/fault on the
  # published ports 8091 and 8092.
  ai-service:
    <<: *common
    build:
      context: services/go
      dockerfile: Dockerfile
      target: external-stub
    image: external-stub:local
    container_name: eop-ai-service
    environment:
      EOP_STUB_SERVICE: "ai"
    ports:
      - "8091:8090"

  corporate-service:
    <<: *common
    image: external-stub:local
    container_name: eop-corporate-service
    depends_on:
      - ai-service
    environment:
      EOP_STUB_SERVICE: "corporate"
    ports:
      - "8092:8090"

  # US-302 (#52): job store of the API gateway. No persistence: jobs only live 5 minutes after
  # they finish (ADR-010 §5).
  redis:
    <<: *common
    image: redis:7.4-alpine
    container_name: eop-redis
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "volatile-ttl", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # US-404 (#72): MQTT broker of the edge devices (ADR-013). Same service as the firmware's
  # (#68); devices and the simulator publish on 1883.
  mosquitto:
    <<: *common
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - eop-mosquitto-data:/mosquitto/data

  # US-404 (#72): MQTT -> eop-server TELEMETRY, deduplicated in Redis (ADR-028). Metrics on 9103.
  edge-ingestor:
    <<: *common
    build:
      context: services/go
      dockerfile: Dockerfile
      target: edge-ingestor
    image: edge-ingestor:local
    container_name: eop-edge-ingestor
    environment:
      EOP_MQTT_BROKER: "tcp://mosquitto:1883"
      EOP_SERVER_ADDR: "eop-server:9026"
      EOP_REDIS_ADDR: "redis:6379"
      OTEL_SERVICE_NAME: "edge-ingestor"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
    ports:
      - "9103:9103"
    depends_on:
      - mosquitto
      - redis
      - eop-server

  # Simulated bunkers with the firmware's payloads: docker compose --profile edge-sim up -d edge-sim
  edge-sim:
    <<: *common
    profiles: ["edge-sim"]
    build:
      context: services/go
      dockerfile: Dockerfile
      target: edge-sim
    image: edge-sim:local
    container_name: eop-edge-sim
    environment:
      EOP_MQTT_BROKER: "tcp://mosquitto:1883"
      EOP_SIM_DEVICES: "5"
    depends_on:
      - mosquitto

  # US-205 (#43): Prometheus + Grafana, scraping eop-server's /metrics (#42) and provisioning
  # the dashboards already versioned under monitoring/grafana/ (#38, #39). Not chained to
  # eop-server via depends_on — Prometheus tolerates a target being down at scrape time, no
  # need to serialize startup order for that.
  prometheus:
    <<: *common
    image: prom/prometheus:v3.9.1
    container_name: eop-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    <<: *common
    image: grafana/grafana:13.2.0
    container_name: eop-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      # Individual file mounts, not the whole provisioning/ tree: bind-mounting the whole
      # directory read-only and then mounting dashboards/ into a subdirectory of it fails —
      # Docker can't create the "eop" mountpoint inside an already-read-only bind mount
      # (confirmed live: "mkdirat ... read-only file system"). Same granularity as
      # k8s/grafana-deployment.yaml's per-file ConfigMap mounts, which don't hit this.
      - ./monitoring/grafana/provisioning/datasources/prometheus-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus-datasource.yaml:ro
      - ./monitoring/grafana/provisioning/dashboards/eop-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/eop-dashboard-provider.yaml:ro
      - ./monitoring/grafana/provisioning/alerting/eop-slo-alerts.yaml:/etc/grafana/provisioning/alerting/eop-slo-alerts.yaml:ro
      - ./monitoring/grafana/provisioning/alerting/eop-hpc-alerts.yaml:/etc/grafana/provisioning/alerting/eop-hpc-alerts.yaml:ro
      - ./monitoring/grafana/provisioning/alerting/eop-gateway-alerts.yaml:/etc/grafana/provisioning/alerting/eop-gateway-alerts.yaml:ro
      - ./monitoring/grafana/provisioning/alerting/eop-edge-alerts.yaml:/etc/grafana/provisioning/alerting/eop-edge-alerts.yaml:ro
      - ./monitoring/grafana/dashboards/:/etc/grafana/provisioning/dashboards/eop/:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  eop-mosquitto-data:
  eop-signoz-clickhouse:
  eop-signoz-clickhouse-user-scripts:
  eop-signoz-sqlite:
  eop-signoz-zookeeper-1:
