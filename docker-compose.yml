services:
  eop-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: eop-server:local
    container_name: eop-server
    environment:
      EOP_PORT: "9026"
      EOP_IDLE_TIMEOUT: "30"
      EOP_MAX_CLIENTS: "100"
      EOP_HEARTBEAT_INTERVAL: "5"
    ports:
      - "9026:9026"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9026"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: eop-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  signoz:
    image: signoz/signoz-standalone:latest
    container_name: eop-signoz
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - eop-signoz-clickhouse-data:/var/lib/clickhouse
      - eop-signoz-data:/var/lib/signoz
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://127.0.0.1:8080 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  eop-signoz-clickhouse-data:
  eop-signoz-data: