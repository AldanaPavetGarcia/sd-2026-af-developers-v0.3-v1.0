# Persistent storage the development deployment keeps in emptyDir (US-406, pending from v0.3):
# ZooKeeper's coordination state and ClickHouse's traces and logs survive a Pod restart.
# Prometheus' claim is k8s/prometheus-pvc.yaml (the 30-day SLO window, #67).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-data
  labels:
    app: zookeeper-1
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  labels:
    app: clickhouse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
